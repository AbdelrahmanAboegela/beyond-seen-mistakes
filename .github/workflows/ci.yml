name: artifact-integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python src/analyze_lop_controls.py --outdir build/lop_controls
      - run: python src/analyze_matched_composition.py --runs 'results/matched_composition_v3_optimized/runs/*.json' --outdir build/matched
      - run: python src/compose_final_results.py --matched build/matched/stats.json --lop build/lop_controls/stats.json --out build/rq_stats.json
      - run: python scripts/generate_figures.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
