[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-seen-mistakes"
version = "0.3.0"  # matches the v0.3.0 tag on main and CITATION.cff
description = "Diagnosing natural error-composition shift in multi-criterion exercise assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "torch>=2.2,<3",
    "matplotlib>=3.8,<4",
]

# pytest is a development tool, not a runtime dependency: installing the
# package should not drag in a test framework.
[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The modules live directly in src/ rather than in a nested directory, so the
# package is mapped explicitly.  `packages.find` with `where = ["src"]` finds
# nothing here and would build an empty wheel.
[tool.setuptools]
packages = ["beyond_seen_mistakes"]

[tool.setuptools.package-dir]
beyond_seen_mistakes = "src"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::alexgym_data.SyntheticDataWarning"]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.pyrefly]
search-paths = ["src"]
